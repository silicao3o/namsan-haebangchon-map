const map=L.map('map');
// 모바일 시트 열고 닫기
const side=document.getElementById('side'),handle=document.getElementById('handle');
const isMobile=()=>matchMedia('(max-width:700px)').matches;
function setPeek(){side.style.setProperty('--peek',(handle.offsetHeight+side.querySelector('h1').offsetHeight+side.querySelector('.btns').offsetHeight+document.getElementById('cats').offsetHeight+22)+'px')}
function setSheet(open){if(!isMobile())return;side.classList.toggle('open',open);handle.textContent=open?'목록 접기 ▼':'목록 펼치기 ▲'}
handle.onclick=()=>setSheet(!side.classList.contains('open'));
map.on('popupopen',()=>setSheet(false));
// 모바일에선 아래 시트에 가리지 않게 여백을 줌
const pad=()=>isMobile()?{paddingTopLeft:[30,30],paddingBottomRight:[30,side.offsetHeight+30]}:{padding:[40,40]};
// 로컬 파일(file://)로 열면 일부 타일 서버가 403을 줘서, 오류가 나면 다음 서버로 바꿈
const TILES=[
  ['https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',{maxZoom:19,subdomains:'abc',attribution:'&copy; OpenStreetMap, Tiles: OSM France'}],
  ['https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}],
  ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,maxNativeZoom:16,attribution:'Tiles &copy; Esri'}]];
let tileIdx=0,tileLayer;
function useTiles(i){
  if(tileLayer)map.removeLayer(tileLayer);
  let errs=0;
  tileLayer=L.tileLayer(...TILES[i]).on('tileerror',()=>{if(++errs===3&&tileIdx<TILES.length-1)useTiles(++tileIdx)}).addTo(map);
}
useTiles(0);
const q=s=>encodeURIComponent(s), layers={}, all=[];
// 가까이 붙은 핀은 'N곳' 묶음으로 보여주고, 누르면 확대해서 풀어줌 (18레벨부터는 전부 낱개)
const cluster=L.markerClusterGroup({maxClusterRadius:30,disableClusteringAtZoom:18,showCoverageOnHover:false,spiderfyOnMaxZoom:false,
  iconCreateFunction:c=>{const cols=[...new Set(c.getAllChildMarkers().map(m=>m.options.color))];
    return L.divIcon({className:'',html:`<div class="clu">${c.getChildCount()}곳<i>${cols.map(x=>`<b style="background:${x}"></b>`).join('')}</i></div>`,iconSize:[40,40],iconAnchor:[20,20]})}}).addTo(map);
const icon=(n,c)=>L.divIcon({className:'',html:`<div class="num" style="background:${c}">${n}</div>`,iconSize:[28,24],iconAnchor:[14,12],popupAnchor:[0,-10]});
const score=p=>p.src==='naver'?`네이버 방문자 리뷰 ${p.cnt}${p.rating?' · ★'+p.rating.toFixed(2):''}`:`★ ${p.rating.toFixed(1)} (리뷰 ${p.cnt}) · 최근 리뷰 ${p.latest}`;
const mineTag=p=>p.mine?'<span class="mine">💚 내가 고른 곳</span> ':'';
const naverUrl=p=>p.pid?`https://map.naver.com/p/entry/place/${p.pid}`:`https://map.naver.com/p/search/${q(p.name)}`;
function popup(p){return `<div class="pop">${mineTag(p)}<b>${p.name}</b><div class="meta">${score(p)}<br>${p.menu}<br>${p.addr}</div><div class="hrs">🕒 10/24(토) ${p.sat}${p.off?'<br>'+p.off:''}${p.warn?'<br><span class="warn">⚠️ '+p.warn+'</span>':''}</div>
${p.rid?`<a href="https://www.diningcode.com/profile.php?rid=${p.rid}" target="_blank">다이닝코드</a>`:''}<a href="${naverUrl(p)}" target="_blank">네이버지도</a><a href="https://map.kakao.com/?q=${q(p.name)}" target="_blank">카카오맵</a></div>`}
const list=document.getElementById('list');
GROUPS.forEach((g,gi)=>{
  const prefix=g.prefix;
  layers[g.id]={on:true,markers:[]};
  const h=document.createElement('h2');h.innerHTML=`<span class="num" style="background:${g.color};min-width:14px;width:14px;height:14px;padding:0;border:0"></span>${g.name}`;
  const chip=document.createElement('button');chip.textContent=g.name.replace('해방촌 ','').replace(' (회현·남산)','');chip.style.background=g.color;
  const toggle=()=>{const L_=layers[g.id],on=!L_.on;L_.on=on;on?cluster.addLayers(L_.markers):cluster.removeLayers(L_.markers);h.classList.toggle('off',!on);chip.classList.toggle('off',!on)};
  h.onclick=chip.onclick=toggle;h.toggle=toggle;
  document.getElementById('cats').appendChild(chip);
  list.appendChild(h);
  PLACES.filter(p=>p.g===g.id).forEach((p,i)=>{
    const n=prefix+(i+1);
    const m=L.marker([p.lat,p.lng],{icon:icon(n,g.color)}).bindPopup(popup(p),{maxWidth:280,autoPanPaddingTopLeft:[10,10],autoPanPaddingBottomRight:[10,isMobile()?side.offsetHeight+10:10]})
      .bindTooltip(p.name,{permanent:true,direction:'right',offset:[10,0],className:'nm'});
    m.options.color=g.color;layers[g.id].markers.push(m);cluster.addLayer(m);all.push([p.lat,p.lng]);
    const d=document.createElement('div');d.className='item';
    d.innerHTML=`<span class="num" style="background:${g.color}">${n}</span><div>${mineTag(p)}<b>${p.name}</b> <span class="meta">${p.src==='naver'?(p.rating?'★'+p.rating.toFixed(2)+' · ':'')+'리뷰 '+p.cnt+' (네이버)':'★'+p.rating.toFixed(1)+' ('+p.cnt+')'}</span><br><span class="meta">${p.menu}</span><br><span class="meta">🕒 토 ${p.sat.split(' · ')[0]}</span>${p.warn?'<br><span class="warn">⚠️ '+p.warn+'</span>':''}</div>`;
    d.onclick=()=>{if(!layers[g.id].on)h.toggle();setSheet(false);map.setView([p.lat,p.lng],18,{animate:false});m.openPopup()};
    list.appendChild(d);
  });
});
LANDMARKS.forEach(l=>{
  L.marker([l.lat,l.lng],{icon:L.divIcon({className:'',html:`<div class="lm">🚡 ${l.name}</div>`,iconSize:null,iconAnchor:[0,10]})})
   .bindPopup(`<div class="pop"><b>${l.name}</b><div class="meta">${l.note}</div><a href="https://map.naver.com/p/search/${q(l.name.replace(/ \(.*\)/,''))}" target="_blank">네이버지도</a><a href="https://map.kakao.com/?q=${q(l.name.replace(/ \(.*\)/,''))}" target="_blank">카카오맵</a></div>`).addTo(map);
  all.push([l.lat,l.lng]);
});
const views={
  hbc:()=>map.fitBounds(PLACES.filter(p=>p.g!=='dinner').map(p=>[p.lat,p.lng]),pad()),
  cable:()=>map.fitBounds(PLACES.filter(p=>p.g==='dinner').map(p=>[p.lat,p.lng]).concat(LANDMARKS.map(l=>[l.lat,l.lng])),pad()),
  all:()=>map.fitBounds(all,pad())};
document.querySelectorAll('.btns button').forEach(b=>b.onclick=()=>{setSheet(false);views[b.dataset.v]()});
// 축소하면 이름표가 겹치니 18레벨 미만에서는 숨김
const wrap=document.getElementById('wrap');
const syncLabels=()=>wrap.classList.toggle('hide-labels',map.getZoom()<18);
map.on('zoomend',syncLabels);
setPeek();addEventListener('resize',()=>{setPeek();map.invalidateSize()});
views.hbc();syncLabels();
</script></body></html>

const MODE={walk:{icon:'🚶',name:'도보',dash:null,w:5},car:{icon:'🚕',name:'택시',dash:'2 9',w:5},cable:{icon:'🚡',name:'케이블카',dash:'10 8',w:4}};
const cLayers={};let curCourse=null;
const box=document.getElementById('courseBox'),cbar=document.getElementById('courses');
COURSES.forEach((c,ci)=>{
  const lg=L.layerGroup();
  c.segs.forEach(sg=>{
    L.polyline(sg.line,{pane:'course',color:'#fff',weight:MODE[sg.mode].w+4,opacity:.9}).addTo(lg);
    L.polyline(sg.line,{pane:'course',color:c.color,weight:MODE[sg.mode].w,dashArray:MODE[sg.mode].dash,opacity:.95}).addTo(lg);
  });
  c.stops.forEach((st,i)=>{
    L.marker([st.lat,st.lng],{pane:'courseTop',icon:L.divIcon({className:'',html:`<div class="stepIcon" style="background:${c.color}">${i+1}</div>`,iconSize:[24,24],iconAnchor:[12,12]})})
     .bindTooltip(`${st.t} ${st.name}`,{permanent:true,direction:'left',offset:[-12,0],className:'st st-'+c.id,pane:'courseTop'}).addTo(lg)
     .bindPopup(`<div class="pop"><b>${i+1}. ${st.t} ${st.name}</b><div class="meta">${st.note}</div></div>`);
  });
  document.head.insertAdjacentHTML('beforeend',`<style>.leaflet-tooltip.st-${c.id}{background:${c.color}}</style>`);
  cLayers[c.id]=lg;
  const b=document.createElement('button');b.textContent=c.name.split(' · ')[0].replace('코스 ','')+' '+c.name.split(' · ')[1];
  b.style.setProperty('--c',c.color);b.onclick=()=>showCourse(curCourse===c.id?null:c.id);c.btn=b;cbar.appendChild(b);
});
function moveText(segs){
  return segs.map(sg=>sg.mode==='cable'?'🚡 케이블카 5분':sg.mode==='car'?`🚕 택시 ${sg.dist>=1000?(sg.dist/1000).toFixed(1)+'km':sg.dist+'m'} · ${sg.min}분~ (막히면 10분+)`:`🚶 ${sg.dist>=1000?(sg.dist/1000).toFixed(1)+'km':sg.dist+'m'} · ${sg.min}분`).join(' → ');
}
function showCourse(id){
  Object.values(cLayers).forEach(l=>map.removeLayer(l));
  COURSES.forEach(c=>c.btn.classList.toggle('on',c.id===id));
  curCourse=id;
  document.body.classList.toggle('coursing',!!id);
  if(!id){box.classList.remove('show');return}
  const c=COURSES.find(x=>x.id===id);cLayers[id].addTo(map);
  // 각 멈춤 사이에 해당하는 이동 구간 묶기
  let html=`<h3>${c.name}</h3>`,k=0;
  c.stops.forEach((st,i)=>{
    html+=`<div class="stp" data-i="${i}"><span class="stn">${i+1}</span><div><span class="tm">${st.t}</span> <b>${st.name}</b><div class="nt">${st.note}</div></div></div>`;
    if(i<c.stops.length-1){const segs=[];while(k<c.segs.length){segs.push(c.segs[k]);if(c.segs[k++].b===c.stops[i+1].name)break}
      html+=`<div class="mv">${moveText(segs)}</div>`}
  });
  html+=`<div class="cnote">이동 시간은 길찾기 엔진(OSRM) 계산값이에요. 평지 기준이라 오르막·계단은 더 걸리고, 택시는 토요일에 더 막힐 수 있어요.</div>`;
  box.innerHTML=html;box.style.setProperty('--c',c.color);box.classList.add('show');
  box.querySelectorAll('.stp').forEach(el=>el.onclick=()=>{const st=c.stops[+el.dataset.i];setSheet(false);map.setView([st.lat,st.lng],17)});
  const pts=c.segs.flatMap(s=>s.line);map.fitBounds(pts,pad());
  if(isMobile())handle.textContent='코스 시간표 보기 ▲';
}
setPeek();addEventListener('resize',()=>{setPeek();map.invalidateSize()});
views.hbc();syncLabels();
</script></body></html>
